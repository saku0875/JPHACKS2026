<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>はてなを えらぶ（3択）｜デザイン見本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../screen.css">
<style>
.navi{animation:navi-puni 2.6s ease-in-out infinite;transform-origin:50% 92%}
.navi-react{animation:navi-pop .6s cubic-bezier(.3,1.6,.5,1) both,navi-puni 2.6s .6s ease-in-out infinite;transform-origin:50% 92%}
@keyframes navi-puni{0%,100%{transform:translateY(0) scale(1.03,.97)}50%{transform:translateY(-4px) scale(.98,1.03)}}
@keyframes navi-pop{0%{transform:translateY(24px) scale(.4);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.navi,.navi-react{animation:none}}
</style>
</head>
<body>
<div style="position: relative; z-index: 0; isolation: isolate; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 24px; background: var(--color-white); font-family: var(--font-body); color: var(--color-ink); display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; gap: 10px; height: 56px">
    <a href="08-check.html" aria-label="もどる" style="width: 50px; height: 50px; flex-shrink: 0; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-white); box-shadow: var(--shadow-pop-xs); display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#22223A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div role="img" aria-label="つかまえた ところ" style="width: 54px; height: 54px; flex-shrink: 0">
      <svg aria-hidden="true" width="54" height="54" viewBox="0 0 54 54"><circle cx="27" cy="27" r="24" fill="#EAF0F8" stroke="#FFC83D" stroke-width="5"></circle><circle cx="27" cy="27" r="24" fill="none" stroke="#22223A" stroke-width="2"></circle><rect x="9" y="20" width="36" height="14" rx="7" fill="#3B3F52"></rect><circle cx="37" cy="27" r="4" fill="#F0444F"></circle></svg>
    </div>
    <h1 style="margin: 0; font-family: var(--font-pop); font-weight: 400; font-size: 20px">しんごうの はてな</h1>
  </div>

  <div role="tablist" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 5px; border: 3px solid var(--color-ink); border-radius: 26px; background: var(--color-white)">
    <a href="10-toi3.html" role="tab" aria-selected="true" style="height: 48px; border-radius: 20px; background: var(--color-navi); color: var(--color-white); font-family: var(--font-pop); font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none">3つから えらぶ</a>
    <a href="11-toi-write.html" role="tab" aria-selected="false" style="height: 48px; border-radius: 20px; color: var(--color-ink-sub); font-size: 17px; font-weight: 900; display: flex; align-items: center; justify-content: center; text-decoration: none">じぶんで かく</a>
  </div>

  <div style="margin-top: auto; display: flex; align-items: center; gap: 12px">
    <img class="navi" src="../assets/navi/navi-smile.png" alt="ナビ（にこにこ）" style="width: 78px; height: 78px; flex-shrink: 0">
    <div style="position: relative; flex-grow: 1; padding: 10px 16px; border-radius: 22px; background: var(--color-navi-light); font-size: 21px; font-weight: 900; line-height: 1.7">
      <div style="position: absolute; left: -8px; top: calc(50% - 8px); width: 16px; height: 16px; background: var(--color-navi-light); transform: rotate(45deg)"></div>
      どの はてなが <ruby>気<rt>き</rt></ruby>になる？
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <a href="12-yoso.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 3px solid var(--color-ink); border-radius: 24px; background: var(--color-purple-light); box-shadow: var(--shadow-pop-md); text-decoration: none; color: var(--color-ink)">
      <span style="width: 52px; height: 52px; flex-shrink: 0; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 18px; background: var(--color-purple); display: flex; align-items: center; justify-content: center">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="15" y="15" width="3" height="3"></rect><rect x="19" y="19" width="2" height="2"></rect><rect x="19" y="14" width="2" height="2"></rect><rect x="14" y="19" width="2" height="2"></rect></svg>
      </span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; font-weight: 900; color: var(--color-purple-dark)">じょうほう ・ いくつ？</span>
        <span style="font-size: 21px; font-weight: 900; line-height: 1.7">しんごうは 1<ruby>日<rt>にち</rt></ruby>に<br><ruby>何<rt>なん</rt></ruby><ruby>回<rt>かい</rt></ruby> <ruby>赤<rt>あか</rt></ruby>に なる？</span>
      </span>
    </a>
    <a href="12-yoso.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 3px solid var(--color-ink); border-radius: 24px; background: var(--color-navi-light); box-shadow: var(--shadow-pop-md); text-decoration: none; color: var(--color-ink)">
      <span style="width: 52px; height: 52px; flex-shrink: 0; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 18px; background: var(--color-navi); display: flex; align-items: center; justify-content: center">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M7 4v7M3.5 7.5h7M14 7.5h7M4 17h7M15.5 14.5l5 5M20.5 14.5l-5 5"></path></svg>
      </span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; font-weight: 900; color: var(--color-navi-dark)">さんすう ・ くらべる</span>
        <span style="font-size: 21px; font-weight: 900; line-height: 1.7"><ruby>赤<rt>あか</rt></ruby>と <ruby>青<rt>あお</rt></ruby>、<br><ruby>長<rt>なが</rt></ruby>く つくのは どっち？</span>
      </span>
    </a>
    <a href="12-yoso.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 3px solid var(--color-ink); border-radius: 24px; background: var(--color-mint-light); box-shadow: var(--shadow-pop-md); text-decoration: none; color: var(--color-ink)">
      <span style="width: 52px; height: 52px; flex-shrink: 0; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 18px; background: var(--color-mint); display: flex; align-items: center; justify-content: center">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#22223A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"></path><path d="M7.5 15h9"></path></svg>
      </span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; font-weight: 900; color: var(--color-mint-dark)">りか ・ なぜ？</span>
        <span style="font-size: 21px; font-weight: 900; line-height: 1.7"><ruby>赤<rt>あか</rt></ruby>は どうして<br><ruby>遠<rt>とお</rt></ruby>くから <ruby>見<rt>み</rt></ruby>えやすいの？</span>
      </span>
    </a>
  </div>

  <button type="button" style="margin-top: auto; margin-bottom: 6px; height: 56px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 3px solid var(--color-ink); border-radius: 22px; background: var(--color-white); box-shadow: var(--shadow-pop-sm); color: var(--color-ink); font-family: inherit; font-size: 18px; font-weight: 900; cursor: pointer">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#22223A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"></rect><circle cx="8" cy="8" r="1.4" fill="#22223A"></circle><circle cx="16" cy="16" r="1.4" fill="#22223A"></circle><circle cx="12" cy="12" r="1.4" fill="#22223A"></circle></svg>
    ほかの はてなを だす
  </button>
</div>
<script src="../screen.js"></script>
</body>
</html>
