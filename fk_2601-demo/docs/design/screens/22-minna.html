<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みんなのはてな｜デザイン見本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../screen.css">
<style>
.navi{animation:navi-puni 2.6s ease-in-out infinite;transform-origin:50% 92%}
.navi-react{animation:navi-pop .6s cubic-bezier(.3,1.6,.5,1) both,navi-puni 2.6s .6s ease-in-out infinite;transform-origin:50% 92%}
@keyframes navi-puni{0%,100%{transform:translateY(0) scale(1.03,.97)}50%{transform:translateY(-4px) scale(.98,1.03)}}
@keyframes navi-pop{0%{transform:translateY(24px) scale(.4);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.navi,.navi-react{animation:none}}
</style>
</head>
<body>
<div style="position: relative; z-index: 0; isolation: isolate; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 24px; background: var(--color-white); font-family: var(--font-body); color: var(--color-ink); display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-family: var(--font-pop); font-weight: 400; font-size: 26px">みんなの はてな</h1>
    <span style="align-self: flex-start; display: flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 14px; background: var(--color-pink-light); font-size: 14px; font-weight: 900; color: var(--color-pink-dark)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFFFF" stroke="#A12A55" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"></path></svg>
      なまえは でないよ
    </span>
  </div>

  <div style="display: flex; align-items: center; gap: 10px">
    <img class="navi" src="../assets/navi/navi-think.png" alt="ナビ（はてな）" style="width: 76px; height: 76px; flex-shrink: 0">
    <div style="position: relative; flex-grow: 1; padding: 8px 14px; border-radius: 20px; background: var(--color-navi-light); font-size: 18px; font-weight: 900; line-height: 1.6">
      <div style="position: absolute; left: -8px; top: calc(50% - 8px); width: 16px; height: 16px; background: var(--color-navi-light); transform: rotate(45deg)"></div>
      みんなは なにを<br>みつけたかな？
    </div>
  </div>

  <div style="flex: 1 1 auto; max-height: 560px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 1fr; gap: 12px">
    <article style="display: flex; flex-direction: column; padding: 6px; border-radius: 24px; background: var(--color-mint)">
      <div style="flex: 1 1 auto; display: flex; flex-direction: column; border-radius: 18px; background: var(--color-white); overflow: hidden">
        <div role="img" aria-label="きの しゃしん" style="flex: 1 1 auto; min-height: 96px; background: #EAF6EF;  display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" viewBox="0 0 120 120" width="80" height="80"><circle cx="60" cy="46" r="32" fill="#7FD1A8" stroke="#22223A" stroke-width="3"></circle><rect x="54" y="74" width="12" height="36" rx="3" fill="#B08968" stroke="#22223A" stroke-width="3"></rect></svg>
        </div>
        <div style="padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 16px; font-weight: 900; line-height: 1.4">この きの はっぱは なんまい？</span>
          <span style="align-self: flex-start; padding: 1px 8px; border-radius: 10px; background: var(--color-mint-light); color: var(--color-mint-dark); font-size: 12px; font-weight: 900">りか マスター</span>
        </div>
      </div>
    </article>
    <article style="display: flex; flex-direction: column; padding: 6px; border-radius: 24px; background: var(--color-navi)">
      <div style="flex: 1 1 auto; display: flex; flex-direction: column; border-radius: 18px; background: var(--color-white); overflow: hidden">
        <div role="img" aria-label="じはんきの しゃしん" style="flex: 1 1 auto; min-height: 96px; background: #FDEFEF;  display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" viewBox="0 0 120 120" width="80" height="80"><rect x="30" y="10" width="60" height="100" rx="8" fill="#FFFFFF" stroke="#22223A" stroke-width="4"></rect><rect x="38" y="22" width="12" height="20" rx="3" fill="#9FD3FF"></rect><rect x="54" y="22" width="12" height="20" rx="3" fill="#FFD27A"></rect><rect x="70" y="22" width="12" height="20" rx="3" fill="#B8E6B0"></rect><rect x="38" y="48" width="12" height="20" rx="3" fill="#FFB3C1"></rect><rect x="54" y="48" width="12" height="20" rx="3" fill="#D7C4FF"></rect><rect x="70" y="48" width="12" height="20" rx="3" fill="#9FD3FF"></rect><rect x="40" y="86" width="40" height="12" rx="4" fill="#3B3F52"></rect></svg>
        </div>
        <div style="padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 16px; font-weight: 900; line-height: 1.4">じはんき、1にちで なんぼん うれる？</span>
          <span style="align-self: flex-start; padding: 1px 8px; border-radius: 10px; background: var(--color-navi-light); color: var(--color-navi-dark); font-size: 12px; font-weight: 900">すうがく はかせ</span>
        </div>
      </div>
    </article>
    <article style="display: flex; flex-direction: column; padding: 6px; border-radius: 24px; background: var(--color-purple)">
      <div style="flex: 1 1 auto; display: flex; flex-direction: column; border-radius: 18px; background: var(--color-white); overflow: hidden">
        <div role="img" aria-label="QRコードの しゃしん" style="flex: 1 1 auto; min-height: 96px; background: #F4F5F9;  display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" viewBox="0 0 120 120" width="76" height="76"><rect x="14" y="14" width="92" height="92" rx="6" fill="#FFFFFF" stroke="#22223A" stroke-width="3"></rect><rect x="22" y="22" width="24" height="24" fill="none" stroke="#22223A" stroke-width="5"></rect><rect x="30" y="30" width="8" height="8" fill="#22223A"></rect><rect x="74" y="22" width="24" height="24" fill="none" stroke="#22223A" stroke-width="5"></rect><rect x="82" y="30" width="8" height="8" fill="#22223A"></rect><rect x="22" y="74" width="24" height="24" fill="none" stroke="#22223A" stroke-width="5"></rect><rect x="30" y="82" width="8" height="8" fill="#22223A"></rect><rect x="56" y="24" width="8" height="8" fill="#22223A"></rect><rect x="56" y="56" width="8" height="8" fill="#22223A"></rect><rect x="72" y="60" width="8" height="8" fill="#22223A"></rect><rect x="88" y="76" width="8" height="8" fill="#22223A"></rect><rect x="62" y="84" width="8" height="8" fill="#22223A"></rect></svg>
        </div>
        <div style="padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 16px; font-weight: 900; line-height: 1.4">しろくろの ならべかたは なんとおり？</span>
          <span style="align-self: flex-start; padding: 1px 8px; border-radius: 10px; background: var(--color-purple-light); color: var(--color-purple-dark); font-size: 12px; font-weight: 900">エンジニアレベル</span>
        </div>
      </div>
    </article>
    <article style="display: flex; flex-direction: column; padding: 6px; border-radius: 24px; background: var(--color-navi)">
      <div style="flex: 1 1 auto; display: flex; flex-direction: column; border-radius: 18px; background: var(--color-white); overflow: hidden">
        <div role="img" aria-label="はしの しゃしん" style="flex: 1 1 auto; min-height: 96px; background: #EEF3FA;  display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" viewBox="0 0 120 120" width="88" height="88"><path d="M10 78Q60 34 110 78" fill="none" stroke="#22223A" stroke-width="6" stroke-linecap="round"></path><line x1="10" y1="78" x2="110" y2="78" stroke="#22223A" stroke-width="6" stroke-linecap="round"></line><line x1="35" y1="60" x2="35" y2="78" stroke="#22223A" stroke-width="4"></line><line x1="60" y1="55" x2="60" y2="78" stroke="#22223A" stroke-width="4"></line><line x1="85" y1="60" x2="85" y2="78" stroke="#22223A" stroke-width="4"></line><path d="M6 96q14-8 28 0t28 0t28 0t28 0" fill="none" stroke="#4A9FE8" stroke-width="5" stroke-linecap="round"></path></svg>
        </div>
        <div style="padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 16px; font-weight: 900; line-height: 1.4">この はしを わたると なんぽ？</span>
          <span style="align-self: flex-start; padding: 1px 8px; border-radius: 10px; background: var(--color-navi-light); color: var(--color-navi-dark); font-size: 12px; font-weight: 900">すうがく はかせ</span>
        </div>
      </div>
    </article>
  </div>

  <nav aria-label="メニュー" style="margin: auto -24px -24px; padding-top: 18px; height: 102px; flex-shrink: 0; box-sizing: border-box; background: linear-gradient(var(--color-ink), var(--color-ink)) 0 18px / 100% 3px no-repeat, linear-gradient(var(--color-white), var(--color-white)) 0 18px / 100% 100% no-repeat; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <a href="20-zukan.html" style="padding-top: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--color-ink-muted); font-size: 14px; font-weight: 700"><span style="width: 56px; height: 34px; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6B7090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H20v15H5.5A1.5 1.5 0 0 0 4 19.5z"></path><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H20v-3"></path></svg></span>ずかん</a>
    <a href="21-stamp.html" style="padding-top: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--color-ink-muted); font-size: 14px; font-weight: 700"><span style="width: 56px; height: 34px; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6B7090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5.5" r="2.5"></circle><path d="M10.5 8v4M13.5 8v4"></path><path d="M5 16a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v2H5z"></path><path d="M5 21.5h14"></path></svg></span>スタンプ</a>
    <a href="04-home.html" style="display: flex; flex-direction: column; align-items: center; text-decoration: none"><span style="margin-top: -14px; width: 76px; height: 76px; flex-shrink: 0; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-navi); box-shadow: var(--shadow-pop-sm); color: var(--color-white); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; font-weight: 900"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path><path d="M10 20v-5h4v5"></path></svg>ホーム</span></a>
    <a href="22-minna.html" aria-current="page" style="padding-top: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--color-pink-deep); font-size: 14px; font-weight: 900"><span style="width: 56px; height: 34px; border-radius: 17px; background: var(--color-pink-light); display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#C23668" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M16.5 14.2c2.9.3 5 2.5 5 5.8"></path></svg></span>みんな</a>
    <a href="23-settings.html" style="padding-top: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--color-ink-muted); font-size: 14px; font-weight: 700"><span style="width: 56px; height: 34px; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6B7090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg></span>せってい</a>
  </nav>
</div>

</body>
</html>
