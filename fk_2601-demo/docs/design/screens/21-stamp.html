<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スタンプ（スタンプカード・しょうごう）｜デザイン見本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../screen.css">
<style>
.navi{animation:navi-puni 2.6s ease-in-out infinite;transform-origin:50% 92%}
.navi-react{animation:navi-pop .6s cubic-bezier(.3,1.6,.5,1) both,navi-puni 2.6s .6s ease-in-out infinite;transform-origin:50% 92%}
@keyframes navi-puni{0%,100%{transform:translateY(0) scale(1.03,.97)}50%{transform:translateY(-4px) scale(.98,1.03)}}
@keyframes navi-pop{0%{transform:translateY(24px) scale(.4);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.navi,.navi-react{animation:none}}
.stab{height:50px;padding:0;border:none;border-radius:20px;background:transparent;color:var(--color-ink-sub);font-family:'Mochiy Pop One',sans-serif;font-size:17px;cursor:pointer}
.stab[aria-selected="true"]{background:var(--color-navi);color:var(--color-white)}
.trow{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:8px 16px;box-sizing:border-box;border:3px solid var(--color-ink);border-radius:22px;background:var(--color-white);box-shadow:0 4px 0 var(--color-ink);color:var(--color-ink);font-family:var(--font-body);text-align:left;cursor:pointer}
.trow[aria-pressed="true"]{background:var(--color-navi-light)}
.trow .dot{width:26px;height:26px;flex-shrink:0;box-sizing:border-box;border:3px solid var(--color-ink);border-radius:50%;background:var(--color-white)}
.trow[aria-pressed="true"] .dot{background:var(--color-navi);box-shadow:inset 0 0 0 4px var(--color-white)}
</style>
</head>
<body>
<div style="position: relative; z-index: 0; isolation: isolate; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 24px; background: var(--color-white); font-family: var(--font-body); color: var(--color-ink); display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; gap: 8px; height: 50px">
    <h1 style="margin: 0; font-family: var(--font-pop); font-weight: 400; font-size: 24px">スタンプ</h1>
    <span style="padding: 2px 10px; border-radius: 12px; background: var(--color-yellow); font-family: var(--font-pop); font-size: 14px">9こ</span>
  </div>

  <div role="tablist" aria-label="きりかえ" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 5px; border: 3px solid var(--color-ink); border-radius: 26px; background: var(--color-white)">
    <button type="button" role="tab" class="stab" aria-selected="true" data-v="Cards">スタンプカード</button>
    <button type="button" role="tab" class="stab" aria-selected="false" data-v="Titles">しょうごう</button>
  </div>

  <div class="if" data-if="vCards">
    <div style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 12px">
      <div style="flex: 1 1 auto; padding: 12px 16px 14px; border-radius: 24px; background: var(--color-navi-light); display: flex; flex-direction: column; justify-content: center; gap: 8px">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <span style="font-family: var(--font-pop); font-size: 22px; color: var(--color-navi-dark); line-height: 1.7"><ruby>算数<rt>さんすう</rt></ruby></span>
          <span style="font-family: var(--font-pop); font-size: 17px; color: var(--color-navi-dark)">3/5</span>
        </div>
        <div role="img" aria-label="スタンプ 5こちゅう 3こ" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); justify-items: center">
        <img src="../assets/navi/stamp-blue.png" alt="" style="width: 54px; height: 54px">
        <img src="../assets/navi/stamp-blue.png" alt="" style="width: 54px; height: 54px">
        <img src="../assets/navi/stamp-blue.png" alt="" style="width: 54px; height: 54px">
        <img src="../assets/navi/stamp-empty.png" alt="" style="width: 54px; height: 54px">
        <img src="../assets/navi/stamp-empty.png" alt="" style="width: 54px; height: 54px">
        </div>
        <span style="font-size: 15px; font-weight: 900; color: var(--color-navi-dark)">あと 2こで「すうがく はかせ」</span>
      </div>
      <div style="flex: 1 1 auto; padding: 12px 16px 14px; border-radius: 24px; background: var(--color-mint-light); display: flex; flex-direction: column; justify-content: center; gap: 8px">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <span style="font-family: var(--font-pop); font-size: 22px; color: var(--color-mint-dark); line-height: 1.7"><ruby>理科<rt>りか</rt></ruby></span>
          <span style="font-family: var(--font-pop); font-size: 17px; color: var(--color-mint-dark)">1/5</span>
        </div>
        <div role="img" aria-label="スタンプ 5こちゅう 1こ" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); justify-items: center">
        <img src="../assets/navi/stamp-mint.png" alt="" style="width: 54px; height: 54px">
        <img src="../assets/navi/stamp-empty.png" alt="" style="width: 54px; height: 54px">
        <img src="../assets/navi/stamp-empty.png" alt="" style="width: 54px; height: 54px">
        <img src="../assets/navi/stamp-empty.png" alt="" style="width: 54px; height: 54px">
        <img src="../assets/navi/stamp-empty.png" alt="" style="width: 54px; height: 54px">
        </div>
        <span style="font-size: 15px; font-weight: 900; color: var(--color-mint-dark)">あと 4こで「りか マスター」</span>
      </div>
      <div style="flex: 1 1 auto; padding: 12px 16px 14px; border-radius: 24px; background: var(--color-purple-light); display: flex; flex-direction: column; justify-content: center; gap: 8px">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <span style="font-family: var(--font-pop); font-size: 22px; color: var(--color-purple-dark); line-height: 1.7"><ruby>情報<rt>じょうほう</rt></ruby></span>
          <span style="font-family: var(--font-pop); font-size: 17px; color: var(--color-purple-dark)">5/5 コンプリート！</span>
        </div>
        <div role="img" aria-label="スタンプ 5こちゅう 5こ" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); justify-items: center">
        <img src="../assets/navi/stamp-purple.png" alt="" style="width: 54px; height: 54px">
        <img src="../assets/navi/stamp-purple.png" alt="" style="width: 54px; height: 54px">
        <img src="../assets/navi/stamp-purple.png" alt="" style="width: 54px; height: 54px">
        <img src="../assets/navi/stamp-purple.png" alt="" style="width: 54px; height: 54px">
        <img src="../assets/navi/stamp-purple.png" alt="" style="width: 54px; height: 54px">
        </div>
        <span style="font-size: 15px; font-weight: 900; color: var(--color-purple-dark)">「エンジニアレベル」 ゲット！</span>
      </div>
    </div>
  </div>

  <div class="if" data-if="vTitles" hidden>
    <div style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 24px; background: var(--color-purple); color: var(--color-white)">
        <img class="navi" src="../assets/navi/navi-wow.png" alt="ナビ（わくわく）" style="width: 68px; height: 68px; flex-shrink: 0">
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px; font-weight: 900">いま つけている しょうごう</span>
          <span style="font-family: var(--font-pop); font-size: 23px"><span id="cur-title">エンジニアレベル</span></span>
        </span>
      </div>
      <span style="font-size: 15px; font-weight: 900; color: var(--color-ink-sub); line-height: 1.6">みんなの はてなに のせると、この しょうごうが でるよ</span>
      <span style="margin-top: auto; font-family: var(--font-pop); font-size: 18px">しょうごうを えらぶ</span>
      <button type="button" class="trow" aria-pressed="false" data-name="はてなハンター">
        <span class="dot"></span>
        <svg width="30" height="30" viewBox="0 0 24 24" fill="#FFC83D" stroke="#22223A" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="9" r="6"></circle><path d="M8.5 14L7 22l5-3 5 3-1.5-8" fill="#FF6F9C"></path></svg>
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 18px; font-weight: 900">はてなハンター</span>
          <span style="font-size: 13px; font-weight: 900; color: var(--color-ink-sub)">はじめて あそんだ ときに もらえる</span>
        </span>
      </button>
      <button type="button" class="trow" aria-pressed="true" data-name="エンジニアレベル">
        <span class="dot"></span>
        <svg width="30" height="30" viewBox="0 0 24 24" fill="#FFC83D" stroke="#22223A" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="9" r="6"></circle><path d="M8.5 14L7 22l5-3 5 3-1.5-8" fill="#FF6F9C"></path></svg>
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 18px; font-weight: 900">エンジニアレベル</span>
          <span style="font-size: 13px; font-weight: 900; color: var(--color-ink-sub)">じょうほうの スタンプを 5こ あつめた</span>
        </span>
      </button>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 8px 16px; box-sizing: border-box; border-radius: 22px; background: var(--color-cloud); color: var(--color-ink-sub)">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#6B7090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 18px; font-weight: 900">すうがく はかせ</span>
          <span style="font-size: 13px; font-weight: 900">さんすうの スタンプ あと 2こ</span>
        </span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 8px 16px; box-sizing: border-box; border-radius: 22px; background: var(--color-cloud); color: var(--color-ink-sub)">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#6B7090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 18px; font-weight: 900">りか マスター</span>
          <span style="font-size: 13px; font-weight: 900">りかの スタンプ あと 4こ</span>
        </span>
      </div>
    </div>
  </div>

  <nav aria-label="メニュー" style="margin: auto -24px -24px; padding-top: 18px; height: 102px; flex-shrink: 0; box-sizing: border-box; background: linear-gradient(var(--color-ink), var(--color-ink)) 0 18px / 100% 3px no-repeat, linear-gradient(var(--color-white), var(--color-white)) 0 18px / 100% 100% no-repeat; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <a href="20-zukan.html" style="padding-top: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--color-ink-muted); font-size: 14px; font-weight: 700"><span style="width: 56px; height: 34px; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6B7090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H20v15H5.5A1.5 1.5 0 0 0 4 19.5z"></path><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H20v-3"></path></svg></span>ずかん</a>
    <a href="21-stamp.html" aria-current="page" style="padding-top: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--color-purple-dark); font-size: 14px; font-weight: 900"><span style="width: 56px; height: 34px; border-radius: 17px; background: var(--color-purple-light); display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6A3FD6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5.5" r="2.5"></circle><path d="M10.5 8v4M13.5 8v4"></path><path d="M5 16a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v2H5z"></path><path d="M5 21.5h14"></path></svg></span>スタンプ</a>
    <a href="04-home.html" style="display: flex; flex-direction: column; align-items: center; text-decoration: none"><span style="margin-top: -14px; width: 76px; height: 76px; flex-shrink: 0; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-navi); box-shadow: var(--shadow-pop-sm); color: var(--color-white); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; font-weight: 900"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path><path d="M10 20v-5h4v5"></path></svg>ホーム</span></a>
    <a href="22-minna.html" style="padding-top: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--color-ink-muted); font-size: 14px; font-weight: 700"><span style="width: 56px; height: 34px; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6B7090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M16.5 14.2c2.9.3 5 2.5 5 5.8"></path></svg></span>みんな</a>
    <a href="23-settings.html" style="padding-top: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--color-ink-muted); font-size: 14px; font-weight: 700"><span style="width: 56px; height: 34px; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6B7090" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg></span>せってい</a>
  </nav>
</div>
<script src="../screen.js"></script>
<script>
// スタンプカード ⇔ しょうごう
group('.stab', 'aria-selected', function (tab) {
  document.querySelector('[data-if="vCards"]').hidden = tab.dataset.v !== 'Cards';
  document.querySelector('[data-if="vTitles"]').hidden = tab.dataset.v !== 'Titles';
});
// つける しょうごうを えらぶ（みんなの はてなに でる）
group('.trow', 'aria-pressed', function (row) {
  document.getElementById('cur-title').textContent = row.dataset.name;
});
</script>
</body>
</html>
