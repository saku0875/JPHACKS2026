<style>
.navi{animation:navi-puni 2.6s ease-in-out infinite;transform-origin:50% 92%}

<body>
<div style="position: relative; z-index: 0; isolation: isolate; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 24px; background: var(--color-white); font-family: var(--font-body); color: var(--color-ink); display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; gap: 10px; height: 52px">

    <h1 style="margin: 2px 0 0; font-size: 23px; font-weight: 900; line-height: 1.75">しんごうは 1<ruby>日<rt>にち</rt></ruby>に<br><ruby>何<rt>なん</rt></ruby><ruby>回<rt>かい</rt></ruby> <ruby>赤<rt>あか</rt></ruby>に なる？</h1>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; margin-top: auto">
    <img class="navi" src="../assets/navi/navi-effort.png" alt="ナビ（ぎゅっ）" style="width: 66px; height: 66px; flex-shrink: 0">
    <div style="position: relative; flex-grow: 1; padding: 8px 14px; border-radius: 20px; background: var(--color-navi-light); font-family: var(--font-pop); font-size: 17px; line-height: 1.5">
      <div style="position: absolute; left: -8px; top: calc(50% - 8px); width: 16px; height: 16px; background: var(--color-navi-light); transform: rotate(45deg)"></div>
      どれくらいだと おもう？
    </div>
  </div>

  <div role="radiogroup" aria-label="よそう" style="display: flex; flex-direction: column; gap: 10px">
    <button type="button" role="radio" aria-checked="false" class="lowopt" data-c="0">

      <span>10<ruby>回<rt>かい</rt></ruby>より すくない</span>
    </button>
    <button type="button" role="radio" aria-checked="true" class="lowopt" data-c="1">
      <svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true" style="flex-shrink: 0"><circle cx="23" cy="23" r="21" fill="#FFFFFF" stroke="#22223A" stroke-width="2.5"></circle><circle cx="15" cy="19" r="3.5" fill="#22223A"></circle><circle cx="29" cy="17" r="3.5" fill="#22223A"></circle><circle cx="22" cy="30" r="3.5" fill="#22223A"></circle></svg>
      <span>10〜100<ruby>回<rt>かい</rt></ruby></span>
    </button>
    <button type="button" role="radio" aria-checked="false" class="lowopt" data-c="2">

      <span>100〜1000<ruby>回<rt>かい</rt></ruby></span>
    </button>
    <button type="button" role="radio" aria-checked="false" class="lowopt" data-c="3">
      <svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true" style="flex-shrink: 0"><circle cx="23" cy="23" r="21" fill="#FFFFFF" stroke="#22223A" stroke-width="2.5"></circle><g fill="#22223A"><circle cx="12" cy="15" r="2.4"></circle><circle cx="19" cy="12" r="2.4"></circle><circle cx="26" cy="11" r="2.4"></circle><circle cx="33" cy="14" r="2.4"></circle><circle cx="10" cy="22" r="2.4"></circle><circle cx="17" cy="20" r="2.4"></circle><circle cx="24" cy="19" r="2.4"></circle><circle cx="31" cy="21" r="2.4"></circle><circle cx="37" cy="23" r="2.4"></circle><circle cx="12" cy="29" r="2.4"></circle><circle cx="19" cy="27" r="2.4"></circle><circle cx="26" cy="27" r="2.4"></circle><circle cx="33" cy="29" r="2.4"></circle><circle cx="16" cy="35" r="2.4"></circle><circle cx="23" cy="34" r="2.4"></circle><circle cx="30" cy="35" r="2.4"></circle></g></svg>
      <span>1000〜1<ruby>万<rt>まん</rt></ruby><ruby>回<rt>かい</rt></ruby></span>
    </button>
    <button type="button" role="radio" aria-checked="false" class="lowopt" data-c="4">
      <svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true" style="flex-shrink: 0"><circle cx="23" cy="23" r="21" fill="#22223A" stroke="#22223A" stroke-width="2.5"></circle><g fill="#FFFFFF"><circle cx="14" cy="16" r="1.6"></circle><circle cx="22" cy="12" r="1.6"></circle><circle cx="31" cy="15" r="1.6"></circle><circle cx="12" cy="25" r="1.6"></circle><circle cx="27" cy="22" r="1.6"></circle><circle cx="35" cy="27" r="1.6"></circle><circle cx="19" cy="31" r="1.6"></circle><circle cx="29" cy="34" r="1.6"></circle></g></svg>
      <span>1<ruby>万<rt>まん</rt></ruby><ruby>回<rt>かい</rt></ruby>より おおい</span>
    </button>
  </div>

  <a href="16-hazure.html" style="margin-top: auto; margin-bottom: 6px; height: 76px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 28px; background: var(--color-pink); box-shadow: var(--shadow-pop); color: var(--color-ink); font-family: var(--font-pop); font-size: 28px; display: flex; align-items: center; justify-content: center; text-decoration: none">せーの！</a>
