<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>起動・やくそく｜デザイン見本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../screen.css">
<style>
.navi{animation:navi-puni 2.6s ease-in-out infinite;transform-origin:50% 92%}
.navi-react{animation:navi-pop .6s cubic-bezier(.3,1.6,.5,1) both,navi-puni 2.6s .6s ease-in-out infinite;transform-origin:50% 92%}
@keyframes navi-puni{0%,100%{transform:translateY(0) scale(1.03,.97)}50%{transform:translateY(-4px) scale(.98,1.03)}}
@keyframes navi-pop{0%{transform:translateY(24px) scale(.4);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.navi,.navi-react{animation:none}}
</style>
</head>
<body>
<div style="position: relative; z-index: 0; isolation: isolate; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 24px; background: var(--color-white); font-family: var(--font-body); color: var(--color-ink); display: flex; flex-direction: column; gap: 16px">
  

  <div style="position: relative; align-self: center; margin-top: auto; padding: 26px 24px 24px; background: var(--color-yellow-light); border-radius: 36px; display: flex; flex-direction: column; align-items: center; gap: 4px; overflow: hidden; width: 284px; height: 263px">
    <svg aria-hidden="true" width="342" height="290" viewBox="0 0 342 290" style="position: absolute; left: 0px; top: 10px"><path d="M38 34l6 12 13 2-10 9 3 13-12-7-12 7 3-13-10-9 13-2z" fill="#FFFFFF" stroke="#22223A" stroke-width="2.5" stroke-linejoin="round"></path><circle cx="300" cy="46" r="10" fill="#FF6F9C" stroke="#22223A" stroke-width="2.5"></circle><circle cx="292" cy="168" r="7" fill="#24C3A0" stroke="#22223A" stroke-width="2.5"></circle><path d="M24 168q8-10 16 0t16 0" fill="none" stroke="#4A5AE8" stroke-width="4" stroke-linecap="round"></path></svg>
    <img class="navi" src="../assets/navi/navi-smile.png" alt="ナビ（にこにこ）" style="position: relative; width: 160px; height: 160px">
    <span style="position: relative; font-family: var(--font-pop); font-size: 26px; line-height: 1.5; text-align: center">まちの はてなを<br>みつけろ！</span>
  </div>

  <h1 style="margin: auto 0 0; font-family: var(--font-pop); font-weight: 400; font-size: 22px; text-align: center">でかける まえの やくそく</h1>

  <div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 24px; background: var(--color-pink-light)">
    <span style="width: 44px; height: 44px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; background: var(--color-pink); font-family: var(--font-pop); font-size: 20px; display: flex; align-items: center; justify-content: center">1</span>
    <span style="flex-grow: 1; font-size: 23px; font-weight: 900; line-height: 1.7"><ruby>人<rt>ひと</rt></ruby>の <ruby>顔<rt>かお</rt></ruby>は<br>とらないでね</span>
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#C23668" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="9.5" cy="10.5" r="0.9" fill="#C23668"></circle><circle cx="14.5" cy="10.5" r="0.9" fill="#C23668"></circle><path d="M9.5 15c1.5 1 3.5 1 5 0"></path><line x1="4" y1="4" x2="20" y2="20" stroke-width="2.6"></line></svg>
  </div>
  <div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 24px; background: var(--color-mint-light)">
    <span style="width: 44px; height: 44px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; background: var(--color-mint); font-family: var(--font-pop); font-size: 20px; display: flex; align-items: center; justify-content: center">2</span>
    <span style="flex-grow: 1; font-size: 23px; font-weight: 900; line-height: 1.7">まわりに<br><ruby>気<rt>き</rt></ruby>を つけてね</span>
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0F7A63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2z"></path><line x1="12" y1="10" x2="12" y2="14.5"></line><circle cx="12" cy="17.6" r="0.9" fill="#0F7A63"></circle></svg>
  </div>

  <a href="02-login.html" style="margin-top: auto; margin-bottom: 6px; height: 72px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 26px; background: var(--color-navi); box-shadow: var(--shadow-pop); color: var(--color-white); font-family: var(--font-pop); font-size: 24px; display: flex; align-items: center; justify-content: center; text-decoration: none">やくそく する！</a>
</div>
<script src="../screen.js"></script>

</html>
