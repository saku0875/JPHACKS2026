<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>しょうたい：大はずれ｜デザイン見本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../screen.css">
<style>
.navi{animation:navi-puni 2.6s ease-in-out infinite;transform-origin:50% 92%}
.navi-react{animation:navi-pop .6s cubic-bezier(.3,1.6,.5,1) both,navi-puni 2.6s .6s ease-in-out infinite;transform-origin:50% 92%}
@keyframes navi-puni{0%,100%{transform:translateY(0) scale(1.03,.97)}50%{transform:translateY(-4px) scale(.98,1.03)}}
@keyframes navi-pop{0%{transform:translateY(24px) scale(.4);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.navi,.navi-react{animation:none}}
</style>
</head>
<body>
<div style="position: relative; z-index: 0; isolation: isolate; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 24px; background: var(--color-white); font-family: var(--font-body); color: var(--color-ink); display: flex; flex-direction: column; gap: 16px">
  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0; z-index: -1; pointer-events: none"><g stroke="#4A5AE8" stroke-width="4" stroke-linecap="round"><path d="M14 40l14 8"></path><path d="M10 70h16"></path><path d="M14 100l14-8"></path></g><circle cx="372" cy="22" r="6" fill="#FFC83D"></circle><path d="M352 160l12 4-9 9z" fill="#FF6F9C"></path><path d="M8 470q7-9 14 0t14 0" fill="none" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round"></path><circle cx="378" cy="480" r="6" fill="#24C3A0"></circle></svg>

  <div style="display: flex; align-items: center; gap: 10px">
    <img class="navi-react" src="../assets/navi/navi-wow.png" alt="ナビ（びっくり・青）" style="width: 128px; height: 128px; flex-shrink: 0">
    <div style="position: relative; flex-grow: 1; padding: 12px 16px; border-radius: 24px; background: var(--color-navi-light); font-family: var(--font-pop); font-size: 23px; line-height: 1.5; color: var(--color-navi-dark)">
      <div style="position: absolute; left: -8px; top: calc(50% - 8px); width: 16px; height: 16px; background: var(--color-navi-light); transform: rotate(45deg)"></div>
      こんなに<br>ちがうの！？
    </div>
  </div>

  <div style="position: relative; margin-top: auto; padding: 14px 20px 18px; border-radius: 30px; background: var(--color-navi-light); display: flex; flex-direction: column; align-items: flex-start; gap: 4px">
    <span style="font-size: 15px; font-weight: 900; color: var(--color-ink-sub)">はてなの しょうたい</span>
    <div style="display: flex; align-items: baseline; gap: 4px">
      <span style="font-family: var(--font-pop); font-size: 92px; line-height: 1.15; color: var(--color-navi)">720</span>
      <span style="font-family: var(--font-pop); font-size: 32px; line-height: 1.6; color: var(--color-navi)"><ruby>回<rt>かい</rt></ruby></span>
    </div>
    <span style="padding: 4px 16px; border-radius: 18px; background: var(--color-yellow); color: var(--color-ink); font-family: var(--font-pop); font-size: 22px; line-height: 1.7">よそうの <ruby>約<rt>やく</rt></ruby>7<ruby>倍<rt>ばい</rt></ruby>！</span>
    <svg role="img" aria-label="おおはずれの はんこ" width="112" height="112" viewBox="0 0 112 112" style="position: absolute; right: -8px; top: -20px; transform: rotate(12deg)"><circle cx="56" cy="56" r="50" fill="#FFFFFF" fill-opacity="0.85" stroke="#4A5AE8" stroke-width="6"></circle><circle cx="56" cy="56" r="41" fill="none" stroke="#4A5AE8" stroke-width="2.5"></circle><text x="56" y="63" text-anchor="middle" font-family="Mochiy Pop One, sans-serif" font-size="18" fill="#4A5AE8">大はずれ</text></svg>
  </div>

  <div role="img" aria-label="きみの よそう 100、こたえ 720。とても はなれている" style="position: relative; height: 112px">
    <span style="position: absolute; left: 4px; top: 4px; font-family: var(--font-pop); font-size: 13px; color: var(--color-ink-sub)">0</span>
    <span style="position: absolute; right: 4px; top: 4px; font-family: var(--font-pop); font-size: 13px; color: var(--color-ink-sub)">1000</span>
    <div style="position: absolute; left: 0; right: 0; top: 28px; height: 46px; box-sizing: border-box; border-radius: 18px; background: var(--color-cloud)"></div>
    <div style="position: absolute; left: 14px; right: 14px; top: 50px; height: 0; border-top: 3px dashed var(--color-white)"></div>
    <div style="position: absolute; left: 50px; width: 187px; top: 31px; height: 40px; background: var(--color-zure)"></div>
    <span style="position: absolute; left: 33px; top: 34px; width: 34px; height: 34px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-pink); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="#22223A" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"></path></svg></span>
    <span style="position: absolute; left: 217px; top: 31px; width: 40px; height: 40px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-navi); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 21V4h11l-2 4 2 4H6"></path></svg></span>
    <div style="position: absolute; left: 0; width: 100px; top: 82px; text-align: center; font-family: var(--font-pop); font-size: 16px">きみ 100</div>
    <div style="position: absolute; left: 182px; width: 110px; top: 82px; text-align: center; font-family: var(--font-pop); font-size: 16px; color: var(--color-navi-dark)">こたえ 720</div>
  </div>

  <div style="margin-top: auto; display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-radius: 24px; background: var(--color-mint-light)">
    <svg width="38" height="38" viewBox="0 0 24 24" fill="#FFC83D" stroke="#22223A" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
    <span style="font-size: 21px; font-weight: 900; line-height: 1.7">ねている 8<ruby>時間<rt>じかん</rt></ruby>でも<br>240<ruby>回<rt>かい</rt></ruby>！</span>
  </div>

  <a href="17-nazo.html" style="margin-top: auto; margin-bottom: 6px; height: 72px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 26px; background: var(--color-navi); box-shadow: var(--shadow-pop); color: var(--color-white); font-family: var(--font-pop); font-size: 24px; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5L21 21"></path></svg>
    なぞときへ！
  </a>
</div>
<script src="../screen.js"></script>
</body>
</html>
