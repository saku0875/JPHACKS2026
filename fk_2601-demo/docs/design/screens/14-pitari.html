<style>
.navi{animation:navi-puni 2.6s ease-in-out infinite;transform-origin:50% 92%}

@keyframes navi-pop{0%{transform:translateY(24px) scale(.4);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.navi,.navi-react{animation:none}}
</style>

    <div style="position: relative; flex-grow: 1; padding: 12px 16px; border-radius: 24px; background: var(--color-red-light); font-family: var(--font-pop); font-size: 25px; line-height: 1.45; color: var(--color-red-dark)">
      <div style="position: absolute; left: -8px; top: calc(50% - 8px); width: 16px; height: 16px; background: var(--color-red-light); transform: rotate(45deg)"></div>

    <div style="display: flex; align-items: baseline; gap: 4px">
      <span style="font-family: var(--font-pop); font-size: 92px; line-height: 1.15; color: var(--color-navi)">720</span>
      <span style="font-family: var(--font-pop); font-size: 32px; line-height: 1.6; color: var(--color-navi)"><ruby>回<rt>かい</rt></ruby></span>
    </div>
    <span style="display: flex; align-items: center; gap: 6px; padding: 6px 16px; border-radius: 18px; background: var(--color-white); color: var(--color-red-dark); font-family: var(--font-pop); font-size: 20px">ほぼ ぴったり！</span>
    <svg role="img" aria-label="ピタリの はんこ" width="112" height="112" viewBox="0 0 112 112" style="position: absolute; right: -8px; top: -20px; transform: rotate(12deg)"><circle cx="56" cy="56" r="50" fill="#FFFFFF" fill-opacity="0.85" stroke="#F0444F" stroke-width="6"></circle><circle cx="56" cy="56" r="41" fill="none" stroke="#F0444F" stroke-width="2.5"></circle><text x="56" y="64" text-anchor="middle" font-family="Mochiy Pop One, sans-serif" font-size="22" fill="#F0444F">ピタリ</text></svg>

    <span style="position: absolute; right: 4px; top: 4px; font-family: var(--font-pop); font-size: 13px; color: var(--color-ink-sub)">1000</span>
    <div style="position: absolute; left: 0; right: 0; top: 28px; height: 46px; box-sizing: border-box; border-radius: 18px; background: var(--color-cloud)"></div>
    <div style="position: absolute; left: 14px; right: 14px; top: 50px; height: 0; border-top: 3px dashed var(--color-white)"></div>
    <span style="position: absolute; left: 208px; top: 34px; width: 34px; height: 34px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-pink); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="#22223A" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"></path></svg></span>
    <span style="position: absolute; left: 226px; top: 31px; width: 40px; height: 40px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-navi); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 21V4h11l-2 4 2 4H6"></path></svg></span>
    <div style="position: absolute; left: 110px; width: 220px; top: 82px; text-align: center; font-family: var(--font-pop); font-size: 16px">きみ 700 ・ <span style="color: var(--color-navi-dark)">こたえ 720</span></div>
  </div>

  <div style="margin-top: auto; display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-radius: 24px; background: var(--color-mint-light)">
    <svg width="38" height="38" viewBox="0 0 24 24" fill="#FFC83D" stroke="#22223A" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
    <span style="font-size: 21px; font-weight: 900; line-height: 1.7">ねている 8<ruby>時間<rt>じかん</rt></ruby>でも<br>240<ruby>回<rt>かい</rt></ruby>！</span>
  </div>

  <a href="17-nazo.html" style="margin-top: auto; margin-bottom: 6px; height: 72px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 26px; background: var(--color-navi); box-shadow: var(--shadow-pop); color: var(--color-white); font-family: var(--font-pop); font-size: 24px; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5L21 21"></path></svg>
