<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>つかまえた！（待ち・まめちしき）｜デザイン見本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../screen.css">
<style>
.navi{animation:navi-puni 2.6s ease-in-out infinite;transform-origin:50% 92%}
.navi-react{animation:navi-pop .6s cubic-bezier(.3,1.6,.5,1) both,navi-puni 2.6s .6s ease-in-out infinite;transform-origin:50% 92%}
@keyframes navi-puni{0%,100%{transform:translateY(0) scale(1.03,.97)}50%{transform:translateY(-4px) scale(.98,1.03)}}
@keyframes navi-pop{0%{transform:translateY(24px) scale(.4);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
.fact{animation:fact-in .5s ease-out both}
@keyframes fact-in{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.navi,.navi-react,.fact{animation:none}}
</style>
</head>
<body>
<div style="position: relative; z-index: 0; isolation: isolate; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 24px; background: var(--color-white); font-family: var(--font-body); color: var(--color-ink); display: flex; flex-direction: column; gap: 16px">
  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0; z-index: -1; pointer-events: none"><circle cx="30" cy="20" r="7" fill="#FFC83D"></circle><path d="M360 18l14 5-11 10z" fill="#FF6F9C"></path><rect x="196" y="12" width="12" height="12" rx="2" fill="#24C3A0" transform="rotate(25 202 18)"></rect><path d="M336 150q8-10 16 0t16 0" fill="none" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round"></path><circle cx="16" cy="170" r="6" fill="#4A5AE8"></circle><path d="M372 92l4 9 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1z" fill="#FFC83D"></path></svg>

  <div style="display: flex; align-items: center; gap: 14px; margin-top: 6px">
    <div role="img" aria-label="つかまえた ところ" style="position: relative; width: 128px; height: 128px; flex-shrink: 0">
      <svg aria-hidden="true" width="128" height="128" viewBox="0 0 128 128" style="position: absolute; left: 0; top: 0"><circle cx="64" cy="64" r="58" fill="#EAF0F8" stroke="#FFC83D" stroke-width="10"></circle><circle cx="64" cy="64" r="58" fill="none" stroke="#4A5AE8" stroke-width="4"></circle><rect x="18" y="48" width="92" height="34" rx="17" fill="#3B3F52"></rect><circle cx="38" cy="65" r="10" fill="#5B6074"></circle><circle cx="64" cy="65" r="10" fill="#5B6074"></circle><circle cx="90" cy="65" r="10" fill="#F0444F"></circle></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-family: var(--font-pop); font-size: 32px; color: var(--color-pink); -webkit-text-stroke: 1.5px var(--color-ink)">みつけた！</span>
      <span style="align-self: flex-start; padding: 4px 12px; border-radius: 14px; background: var(--color-yellow-light); font-size: 15px; font-weight: 900">いま しらべてるよ</span>
    </div>
  </div>

  <div style="position: relative; margin-top: auto; padding-top: 52px; display: flex; flex-direction: column; gap: 8px">
    <img class="navi" src="../assets/navi/navi-effort.png" alt="ナビ（しらべ中）" style="position: absolute; left: calc(45% - 34px); top: -6px; width: 62px; height: 62px">
    <div role="progressbar" aria-label="しらべている ところ" aria-valuemin="0" aria-valuemax="100" aria-valuenow="45" style="height: 22px; box-sizing: border-box; border-radius: 11px; background: var(--color-navi-light); overflow: hidden">
      <div style="width: 45%; height: 100%; border-radius: 11px; background: var(--color-navi)"></div>
    </div>
    <span style="font-size: 15px; font-weight: 900; color: var(--color-ink-sub); text-align: center">1ぷんくらい かかる ことも あるよ</span>
  </div>

  <div style="margin-top: auto; flex: 1 1 auto; max-height: 260px; padding: 16px 18px 18px; border-radius: 28px; background: var(--color-yellow-light); display: flex; flex-direction: column; gap: 12px">
    <span style="display: flex; align-items: center; gap: 6px; font-family: var(--font-pop); font-size: 17px; color: var(--color-yellow-dark)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#FFFFFF" stroke="#6E4D00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"></path></svg>
      まめちしき
    </span>
    <div aria-live="polite" style="flex: 1 1 auto; min-height: 88px; display: flex; align-items: center">
      <div class="if" data-if="f0">
        <span class="fact" style="font-size: 24px; font-weight: 900; line-height: 1.75">1<ruby>円<rt>えん</rt></ruby><ruby>玉<rt>だま</rt></ruby>の <ruby>重<rt>おも</rt></ruby>さは<br>ちょうど 1グラム！</span>
      </div>
      <div class="if" data-if="f1" hidden>
        <span class="fact" style="font-size: 24px; font-weight: 900; line-height: 1.75">タコの しんぞうは<br>3つ あるんだって！</span>
      </div>
      <div class="if" data-if="f2" hidden>
        <span class="fact" style="font-size: 24px; font-weight: 900; line-height: 1.75">1<ruby>円<rt>えん</rt></ruby><ruby>玉<rt>だま</rt></ruby>の はばは<br>ちょうど 2センチ！</span>
      </div>
      <div class="if" data-if="f3" hidden>
        <span class="fact" style="font-size: 24px; font-weight: 900; line-height: 1.75">ハチの すの へやは<br>6かくけいの かたち！</span>
      </div>
    </div>
    <div aria-hidden="true" style="display: flex; justify-content: center; gap: 8px">
      <span class="dot" style="width: 22px; height: 10px; border-radius: 5px; background: var(--color-yellow-dark)"></span>
      <span class="dot" style="width: 10px; height: 10px; border-radius: 5px; background: var(--color-yellow)"></span>
      <span class="dot" style="width: 10px; height: 10px; border-radius: 5px; background: var(--color-yellow)"></span>
      <span class="dot" style="width: 10px; height: 10px; border-radius: 5px; background: var(--color-yellow)"></span>
    </div>
  </div>

  <div style="margin-top: auto; height: 78px; flex-shrink: 0">
  <div class="if" data-if="done" hidden>
    <a href="08-check.html" style="margin-bottom: 6px; height: 72px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 26px; background: var(--color-navi); box-shadow: var(--shadow-pop); color: var(--color-white); font-family: var(--font-pop); font-size: 24px; display: flex; align-items: center; justify-content: center; text-decoration: none">できた！ みてみる</a>
  </div>
  </div>
</div>
<script src="../screen.js"></script>
<script>
// まめちしきは 10びょうごとに つぎへ（ボタンなし・こたえなし）
var facts = document.querySelectorAll('[data-if^="f"]');
var dots = document.querySelectorAll('.dot');
var current = 0;
setInterval(function () {
  current = (current + 1) % facts.length;
  facts.forEach(function (f, i) { f.hidden = i !== current; });
  dots.forEach(function (d, i) {
    d.style.width = i === current ? '22px' : '10px';
    d.style.background = i === current ? 'var(--color-yellow-dark)' : 'var(--color-yellow)';
  });
}, 10000);
// 問いができたら（見本では5秒後）「できた！みてみる」を出す
setTimeout(function () { document.querySelector('[data-if="done"]').hidden = false; }, 5000);
</script>
</body>
</html>
