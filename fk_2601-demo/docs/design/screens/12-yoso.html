<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>せーの！（5年生から）｜デザイン見本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../screen.css">
<style>
input.num::-webkit-inner-spin-button,input.num::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input.num{-moz-appearance:textfield;appearance:textfield}
input.log{-webkit-appearance:none;appearance:none;width:100%;height:48px;background:transparent;margin:0;cursor:pointer}
input.log::-webkit-slider-runnable-track{height:18px;border-radius:12px;background:var(--color-navi-light);border:3px solid var(--color-ink)}
input.log::-webkit-slider-thumb{-webkit-appearance:none;width:44px;height:44px;border-radius:50%;background:var(--color-pink);border:3px solid var(--color-ink);margin-top:-16px}
input.log::-moz-range-track{height:18px;border-radius:12px;background:var(--color-navi-light);border:3px solid var(--color-ink)}
input.log::-moz-range-thumb{width:38px;height:38px;border-radius:50%;background:var(--color-pink);border:3px solid var(--color-ink)}
.navi{animation:navi-puni 2.6s ease-in-out infinite;transform-origin:50% 92%}
.navi-react{animation:navi-pop .6s cubic-bezier(.3,1.6,.5,1) both,navi-puni 2.6s .6s ease-in-out infinite;transform-origin:50% 92%}
@keyframes navi-puni{0%,100%{transform:translateY(0) scale(1.03,.97)}50%{transform:translateY(-4px) scale(.98,1.03)}}
@keyframes navi-pop{0%{transform:translateY(24px) scale(.4);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.navi,.navi-react{animation:none}}
</style>
</head>
<body>
<div style="position: relative; z-index: 0; isolation: isolate; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 24px; background: var(--color-white); font-family: var(--font-body); color: var(--color-ink); display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; gap: 10px; height: 52px">
    <a href="10-toi3.html" aria-label="もどる" style="width: 50px; height: 50px; flex-shrink: 0; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-white); box-shadow: var(--shadow-pop-xs); display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#22223A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="font-family: var(--font-pop); font-size: 22px">せーので よそう！</span>
  </div>

  <div style="padding: 14px 20px; border-radius: 26px; background: var(--color-purple-light)">
    <span style="font-size: 14px; font-weight: 900; color: var(--color-purple-dark)">じょうほうの はてな</span>
    <h1 style="margin: 2px 0 0; font-size: 23px; font-weight: 900; line-height: 1.75">しんごうは 1<ruby>日<rt>にち</rt></ruby>に<br><ruby>何<rt>なん</rt></ruby><ruby>回<rt>かい</rt></ruby> <ruby>赤<rt>あか</rt></ruby>に なる？</h1>
  </div>

  <label for="g" style="margin-top: auto; font-family: var(--font-pop); font-size: 18px; text-align: center">きみの よそうは？</label>
  <div style="height: 116px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 28px; background: var(--color-yellow-light); display: flex; align-items: center; justify-content: center; gap: 4px">
    <input id="g" class="num" type="number" inputmode="numeric" min="1" max="10000" value="100" style="width: 220px; height: 100px; border: none; background: transparent; font-family: var(--font-pop); font-size: 72px; color: var(--color-ink); text-align: center; padding: 0">
    <span style="font-family: var(--font-pop); font-size: 30px; line-height: 1.6"><ruby>回<rt>かい</rt></ruby></span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px">
    <input class="log" type="range" min="0" max="1000" step="1" id="slider" value="500" aria-label="よそうの かず">
    <div style="position: relative; height: 24px; margin: 0 22px; white-space: nowrap; font-family: var(--font-pop); font-size: 14px; color: var(--color-ink-sub)">
      <span style="position: absolute; left: 0; transform: translateX(-50%)">1</span>
      <span style="position: absolute; left: 25%; transform: translateX(-50%)">10</span>
      <span style="position: absolute; left: 50%; transform: translateX(-50%)">100</span>
      <span style="position: absolute; left: 75%; transform: translateX(-50%)">1000</span>
      <span style="position: absolute; left: 100%; transform: translateX(-50%)">1まん</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; margin-top: auto">
    <img class="navi" src="../assets/navi/navi-effort.png" alt="ナビ（ぎゅっ）" style="width: 80px; height: 80px; flex-shrink: 0">
    <div style="position: relative; flex-grow: 1; padding: 10px 16px; border-radius: 22px; background: var(--color-navi-light); font-size: 19px; font-weight: 900; line-height: 1.6">
      <div style="position: absolute; left: -8px; top: calc(50% - 8px); width: 16px; height: 16px; background: var(--color-navi-light); transform: rotate(45deg)"></div>
      ぱっと おもった かずで いいよ！
    </div>
  </div>

  <a href="16-hazure.html" style="margin-top: auto; margin-bottom: 6px; height: 76px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 28px; background: var(--color-pink); box-shadow: var(--shadow-pop); color: var(--color-ink); font-family: var(--font-pop); font-size: 28px; display: flex; align-items: center; justify-content: center; text-decoration: none">せーの！</a>
</div>
<script src="../screen.js"></script>
<script>
// 対数の目盛り：スライダー 0〜1000 が 1〜1万回に対応
var number = document.getElementById('g');
var slider = document.getElementById('slider');
slider.addEventListener('input', function () {
  number.value = Math.max(1, Math.round(Math.pow(10, Number(slider.value) / 250)));
});
number.addEventListener('input', function () {
  var n = parseInt(number.value, 10);
  if (!isNaN(n)) slider.value = Math.round(Math.log10(Math.min(10000, Math.max(1, n))) * 250);
});
</script>
</body>
</html>
