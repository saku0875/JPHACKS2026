<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>さがす（撮影）｜デザイン見本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../screen.css">
<style>
.navi{animation:navi-puni 2.6s ease-in-out infinite;transform-origin:50% 92%}
.navi-react{animation:navi-pop .6s cubic-bezier(.3,1.6,.5,1) both,navi-puni 2.6s .6s ease-in-out infinite;transform-origin:50% 92%}
@keyframes navi-puni{0%,100%{transform:translateY(0) scale(1.03,.97)}50%{transform:translateY(-4px) scale(.98,1.03)}}
@keyframes navi-pop{0%{transform:translateY(24px) scale(.4);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.navi,.navi-react{animation:none}}
</style>
</head>
<body>
<div style="position: relative; z-index: 0; isolation: isolate; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 24px; background: var(--color-white); font-family: var(--font-body); color: var(--color-ink); display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 52px">
    <h1 style="margin: 0; font-family: var(--font-pop); font-weight: 400; font-size: 24px">はてなを さがせ！</h1>
    <a href="04-home.html" aria-label="とじる" style="width: 50px; height: 50px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-white); box-shadow: var(--shadow-pop-xs); display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#22223A" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
  </div>

  <div role="img" aria-label="カメラの えいぞう（しんごうの れい）" style="position: relative; flex: 1 1 auto; min-height: 0; box-sizing: border-box; border-radius: 32px; background: var(--color-photo); overflow: hidden; display: flex; align-items: center; justify-content: center">
    <svg aria-hidden="true" viewBox="0 0 240 320" width="240" height="320"><rect x="112" y="118" width="16" height="200" rx="4" fill="#B7BCCD"></rect><rect x="16" y="44" width="208" height="76" rx="38" fill="#3B3F52"></rect><circle cx="58" cy="82" r="24" fill="#5B6074"></circle><circle cx="120" cy="82" r="24" fill="#5B6074"></circle><circle cx="182" cy="82" r="24" fill="#F0444F"></circle></svg>
    <svg aria-hidden="true" width="336" height="534" viewBox="0 0 336 534" style="position: absolute; left: 0; top: calc(50% - 270px)"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M56 150v-34h34M246 116h34v34M280 300v34h-34M90 334H56v-34" stroke="#22223A" stroke-width="12"></path><path d="M56 150v-34h34M246 116h34v34M280 300v34h-34M90 334H56v-34" stroke="#FFC83D" stroke-width="6"></path></g></svg>
    <span style="position: absolute; top: 14px; left: 14px; right: 14px; display: flex; align-items: center; gap: 8px; padding: 8px 12px; box-sizing: border-box; border-radius: 16px; background: var(--color-pink-light); color: var(--color-pink-dark); font-size: 15px; font-weight: 900">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A12A55" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><line x1="4" y1="4" x2="20" y2="20"></line></svg>
      ひとの かおは とらないでね
    </span>
    <div style="position: absolute; left: 12px; bottom: 12px; display: flex; align-items: center; gap: 6px">
      <img class="navi" src="../assets/navi/navi-smile.png" alt="ナビ" style="width: 68px; height: 68px">
      <span style="padding: 8px 14px; border-radius: 18px; background: var(--color-white); font-size: 16px; font-weight: 900">どこに あるかな？</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; height: 108px">
    <a href="06-kakomu.html" style="justify-self: start; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--color-ink); font-size: 14px; font-weight: 900; text-decoration: none">
      <span style="width: 64px; height: 64px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 22px; background: var(--color-yellow); box-shadow: var(--shadow-pop-sm); display: flex; align-items: center; justify-content: center">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#22223A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M4 17l5-5 4 4 3-3 4 4"></path></svg>
      </span>
      アルバム
    </a>
    <a href="06-kakomu.html" aria-label="とる" style="justify-self: center; width: 96px; height: 96px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-white); box-shadow: var(--shadow-pop-md); display: flex; align-items: center; justify-content: center; text-decoration: none">
      <span style="width: 70px; height: 70px; box-sizing: border-box; border: 3px solid var(--color-ink); border-radius: 50%; background: var(--color-pink)"></span>
    </a>
    <span></span>
  </div>
</div>
<script src="../screen.js"></script>
</body>
</html>
